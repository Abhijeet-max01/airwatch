name: Hourly pipeline

on:
  schedule:
    - cron: "17 * * * *"      # every hour at minute 17 (UTC)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

concurrency:
  group: airwatch-pipeline     # never run two pipelines at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Ingest new hourly readings
        run: python pipeline/ingest.py

      - name: Detect anomalies
        run: python pipeline/detect_anomalies.py

      - name: Build and test dbt models
        run: python run_dbt.py build