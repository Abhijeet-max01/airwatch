name: 'airwatch_dbt'
version: '2.0.0'
profile: 'airwatch_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Thresholds live here, not inside SQL. Change a number, rebuild, done.
vars:
  max_frozen_share: 0.20     # a station is unusable if more than 20% of its readings are stuck
  min_coverage: 0.50         # ...or if it reports fewer than 50% of the hours in its own history
  min_hours_per_day: 18      # a city-day needs 18+ hourly values to count as complete
  naaqs_pm25_24h: 60         # India's national 24-hour PM2.5 standard (ug/m3)
  profile_days: 30           # window for the "best hour of day" profile
  leaderboard_days: 30       # window for the city leaderboard
  max_data_age_hours: 12     # freshness warning threshold

models:
  airwatch_dbt:
    v2:
      staging:
        +materialized: view
      intermediate:
        +materialized: view
      marts:
        +materialized: table
